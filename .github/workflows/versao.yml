name: Publicar versão da linha de comando

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  binarios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      # Build reproduzível: mesmo código, mesmo binário, mesmo resumo.
      - name: Compilar
        run: |
          mkdir dist
          for alvo in windows/amd64 linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os=${alvo%/*}; arq=${alvo#*/}; ext=""; [ "$os" = windows ] && ext=".exe"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arq go build -trimpath -buildvcs=false -ldflags="-s -w" \
              -o "dist/claw-${os}-${arq}${ext}" ./cmd/claw
          done
          cd dist && sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
